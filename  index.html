<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>First Character Stroke Explorer · TypePinyin Lab</title>
<style>
:root{--cream:#FFF9F0;--navy:#183B59;--jade:#247A63;--coral:#F05D5E}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--navy);font:18px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
main{width:100%;max-width:440px}
.card{background:#fff;border:2px solid rgba(24,59,89,.12);border-radius:24px;padding:24px 20px;box-shadow:0 6px 24px rgba(24,59,89,.08);text-align:center}
h1{font:600 1.55rem/1.25 Georgia,"Times New Roman",serif;margin:0 0 12px}
.sub{font-size:1.15rem;margin:0 0 24px}
.btn{display:block;width:100%;min-height:56px;margin-top:12px;padding:14px 18px;border-radius:16px;border:2px solid var(--navy);background:var(--navy);color:#fff;font-weight:600;font-size:1.05rem;font-family:inherit;cursor:pointer;text-align:center;text-decoration:none}
.btn.alt{background:#fff;color:var(--navy)}
.btn.stroke{background:var(--coral);border-color:var(--coral);color:#fff}
.btn:focus-visible,summary:focus-visible{outline:4px solid var(--coral);outline-offset:3px}
svg{width:min(70vw,240px);height:auto;display:block;margin:0 auto 8px;background:var(--cream);border-radius:20px;border:2px solid rgba(24,59,89,.1)}
svg path{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-width:6}
.ref{stroke:var(--navy);opacity:.14}
.done{stroke:var(--jade)}
.cur{stroke:var(--coral)}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:d .7s ease forwards}
@keyframes d{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.draw{animation:none;stroke-dashoffset:0}}
.ch{font-size:3rem;line-height:1;margin:8px 0 0;font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif}
.py{font-size:1.2rem;margin:4px 0}
.ord{font-size:.98rem;margin:4px 0 8px}
.prompt{margin:12px 0 0;padding:12px;border-radius:14px;background:rgba(36,122,99,.1);color:var(--jade);font-weight:600}
.num{fill:var(--navy);font:700 7px sans-serif;stroke:none}
details{margin-top:8px}
summary{min-height:44px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:.95rem;text-decoration:underline;border-radius:12px}
.dots{font-size:.85rem;opacity:.7;margin-bottom:8px}
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<script>
const CH=[
{c:"人",py:"rén · person",ord:"1 left-falling · 2 right-falling",
 s:[["left-falling","M52 16C49 46 37 68 20 84",[44,30]],["right-falling","M47 46C55 64 68 76 84 84",[68,62]]]},
{c:"大",py:"dà · big",ord:"1 horizontal · 2 left-falling · 3 right-falling",
 s:[["horizontal","M16 40L84 40",[50,34]],["left-falling","M52 14C50 44 36 68 16 86",[40,50]],["right-falling","M50 40C56 62 68 76 86 86",[74,66]]]},
{c:"天",py:"tiān · sky / day",ord:"1 top horizontal · 2 second horizontal · 3 left-falling · 4 right-falling",
 s:[["top horizontal","M30 18L70 18",[50,12]],["second horizontal","M12 40L88 40",[50,34]],["left-falling","M50 18C49 44 36 72 16 90",[27,58]],["right-falling","M48 40C56 62 70 78 88 90",[76,68]]]}
];
const URL_BACK="https://chinesestoryforbeginner.substack.com/";
const URL_NEXT="https://chinesestoryforbeginner.substack.com/subscribe?utm_source=test&utm_campaign=email-checkout&next=https%3A%2F%2Fchinesestoryforbeginner.substack.com%2Fpublish%2Fpost%2F219255587simple=true&utm_source=paywall&utm_medium=email&utm_content=219255587&next=https://chinesestoryforbeginner.substack.com/publish/post/219255587&coupon=2f055b7b";
const app=document.getElementById("app");
let i=0,n=0,paper=false;
const P=(d,cls)=>`<path pathLength="1" d="${d}" class="${cls}"/>`;
function intro(){
 app.innerHTML=`<section class="card" aria-labelledby="t"><h1 id="t">Your first three-character writing ladder</h1><p class="sub">人 → 大 → 天 · no score</p><button class="btn" id="go">Start with 人</button></section>`;
 const g=document.getElementById("go");g.onclick=()=>{i=0;n=0;paper=false;render()};g.focus();
}
function svg(c,showNums){
 const ref=c.s.map(s=>P(s[1],"ref")).join("");
 let act="";
 const upto=showNums?c.s.length:n;
 c.s.slice(0,upto).forEach((s,k)=>{act+=P(s[1],(!showNums&&k===n-1)?"cur draw":"done")});
 const nums=showNums?c.s.map((s,k)=>`<text class="num" x="${s[2][0]}" y="${s[2][1]}">${k+1}</text>`).join(""):"";
 const label=showNums?`All ${c.s.length} strokes of ${c.c} in numbered order`:`Stroke diagram for ${c.c}: ${n} of ${c.s.length} strokes shown`;
 return `<svg viewBox="0 0 100 100" role="img" aria-label="${label}">${ref}${act}${nums}</svg>`;
}
function render(){
 const c=CH[i],last=i===CH.length-1,total=c.s.length;
 let btn,prompt="";
 if(paper){
  prompt=`<p class="prompt">Look. Trace. Cover. Write once.</p>`;
  btn=`<button class="btn" id="next">${last?"Finish":"Next: "+CH[i+1].c}</button>`;
 }else if(n<total) btn=`<button class="btn stroke" id="act">Show stroke ${n+1}</button>`;
 else btn=`<button class="btn" id="act">Try ${c.c} on paper</button>`;
 app.innerHTML=`<section class="card" aria-labelledby="ch"><div class="dots">${i+1} / 3</div>${svg(c,false)}
 <p class="ch" id="ch" lang="zh-Hans">${c.c}</p><p class="py">${c.py}</p><p class="ord">${c.ord}</p>${prompt}${btn}
 <details><summary>Show all strokes in numbered order</summary>${svg(c,true)}</details></section>`;
 const a=document.getElementById("act"),nx=document.getElementById("next");
 if(a){a.onclick=()=>{if(n<total)n++;else paper=true;render();(document.getElementById("act")||document.getElementById("next")).focus()}}
 if(nx){nx.onclick=()=>{if(last)done();else{i++;n=0;paper=false;render()}}}
}
function done(){
 app.innerHTML=`<section class="card" aria-labelledby="t"><h1 id="t" tabindex="-1">You wrote a first pattern—not a perfect character.</h1><p class="sub">人 → 大 → 天</p>
 <a class="btn alt" id="b" target="_blank" rel="noopener" aria-label="Back to channel">Back to channel</a>
 <a class="btn" id="f" target="_blank" rel="noopener" aria-label="Next: sentence building">Next: sentence building</a></section>`;
 document.getElementById("b").href=URL_BACK;document.getElementById("f").href=URL_NEXT;
 document.getElementById("t").focus();
}
intro();
</script>
</body>
</html>
